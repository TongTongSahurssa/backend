spring.datasource.url=jdbc:h2:mem:auth-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.auth.jwt-secret=test-secret-that-is-longer-than-thirty-two-bytes
app.auth.access-token-minutes=15
app.auth.refresh-token-days=14
app.auth.secure-cookies=false

app.mail.development-mode=true
app.mail.from=test@example.com
