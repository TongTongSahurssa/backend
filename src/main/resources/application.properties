spring.application.name=resume-admin-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:h2:file:./data/auth;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.auth.secure-cookies=${SECURE_COOKIES:false}
app.auth.jwt-secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.auth.access-token-minutes=15
app.auth.refresh-token-days=14
app.mail.development-mode=${MAIL_DEVELOPMENT_MODE:false}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
