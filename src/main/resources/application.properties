spring.application.name=resume-admin-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/resume_admin}
spring.datasource.username=${DATABASE_USERNAME:resume_admin}
spring.datasource.password=${DATABASE_PASSWORD:resume_admin_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

app.auth.secure-cookies=${SECURE_COOKIES:false}
app.auth.jwt-secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
app.auth.access-token-minutes=15
app.auth.refresh-token-days=14
app.mail.development-mode=${MAIL_DEVELOPMENT_MODE:false}
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
